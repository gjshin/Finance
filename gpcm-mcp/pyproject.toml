[project]
name = "gpcm-mcp"
version = "0.1.0"
description = "국내 상장사 GPCM 배수·WACC 계산 MCP 서버 (DART 기반)"
requires-python = ">=3.11"

# 버전은 앱의 requirements.txt 와 같은 조합으로 고정한다. 같은 라이브러리로 같은
# 숫자가 나와야 하므로 여기서 최신 버전을 쓰면 안 된다.
#
# streamlit 은 뺐다 — 이 패키지는 UI 가 없다. bs4 는 앱에서도 쓰지 않는 죽은 import 였다.
# scipy 도 gpcm_kr.py 가 import 하지 않는다.
dependencies = [
    "mcp==2.0.0",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "requests==2.33.1",
    "openpyxl==3.1.5",
    "OpenDartReader==0.2.2",
    "finance-datareader==0.9.202",
    "yfinance==1.5.2",
    "lxml==6.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
gpcm-mcp = "gpcm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpcm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
